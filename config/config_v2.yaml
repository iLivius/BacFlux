# ─────────────────────────────────────────────────────────────────────────────
# BacFlux v2.0.0 — unified configuration
#
# ONE config drives all four input modes. Set `mode` first; then fill in only
# the blocks that mode reads (each key below notes which modes use it). Keys a
# mode does not read are harmless if left at their defaults.
#
# Quick start:
#   1. mode:              which pipeline to run
#   2. input.*_dir:       where the raw inputs live (per technology)
#   3. directories.*:     where the reference databases live + the output dir
#   4. links.*:           download URLs for the auto-fetched databases
#   5. resources / parameters: tune threads, RAM, and per-mode options
#
# directories.output_dir is resolved to an absolute path automatically, so it
# may be given as relative (e.g. "results/run1") and will still land where you
# expect. Other paths (input.*_dir, directories.*_db, links.*_file) are used
# as-is: give them as absolute paths unless you're sure what they're relative
# to (the workflow's launch directory, not output_dir).
# ─────────────────────────────────────────────────────────────────────────────

# REQUIRED. Which pipeline to run. Selects rules/<mode>/*.smk and the matching
# sample-discovery logic.
mode: illumina                 # Options: illumina | nanopore | hybrid | contigs

# Raw input directories, split by technology. A mode reads only the dir(s) it
# needs; the others may stay empty.
input:
  illumina_dir: ""             # required: illumina, hybrid   — expects {sample}_R1.<ext> + {sample}_R2.<ext>
  nanopore_dir: ""             # required: nanopore, hybrid   — expects {sample}_ont.<ext>
  contigs_dir:  ""             # required: contigs            — expects {sample}.<fasta|fa|fna>
                               # (<ext> = fastq | fq | fastq.gz | fq.gz)

# Reference databases (user-downloaded) and the output directory. Required for
# every mode.
directories:
  output_dir: ""               # all results are written here (created if absent)
  bakta_db:   ""               # Bakta database (also holds amrfinderplus-db/)
  blast_db:   ""               # NCBI nucleotide DB dir; the parameters.nt_version subfolder is used
  eggnog_db:  ""               # eggNOG-mapper database
  gtdbtk_db:  ""               # GTDB-Tk release database
  platon_db:  ""               # Platon plasmid database
  checkv_db:  ""               # OPTIONAL — a CheckV database you already hold. Give the PARENT
                               #   directory containing the versioned folder, e.g.
                               #   /path/to/checkv/ holding checkv-db-v1.5/.
                               #   When set, NOTHING is downloaded: this overrides links.checkv_link
                               #   AND CheckV's own downloader. Use it to stay independent of
                               #   portal.nersc.gov, which is frequently unavailable.
                               #   BacFlux only ever READS this path; it is never written or deleted.
  vs2_db:       ""             # OPTIONAL — a VirSorter2 database you already hold: the directory
                               #   `virsorter setup` produced (containing hmm/, group/, rbs/,
                               #   Done_all_setup). Skips the ~10 GB download. Read by virsorter2
                               #   mode only (phage.caller); ignored when phage.caller: genomad.
  antismash_db: ""             # OPTIONAL — an antiSMASH database directory you already hold (what
                               #   `download-antismash-databases` produces: clusterblast/, pfam/, ...).
                               #   Skips the download. Read in all modes.
  dbcan_db:     ""             # OPTIONAL — a dbCAN database directory you already hold, matching
                               #   the version in links.dbcan_link (dbCAN.hmm, CAZy.dmnd, ...).
                               #   Skips the download. Read in all modes.
  card_db:      ""             # OPTIONAL — an extracted CARD database directory you already hold
                               #   (aro_index.tsv, nucleotide_fasta_protein_homolog_model.fasta).
                               #   Skips the download. Read by illumina, hybrid only (CARD read-
                               #   mapping AMR leg).
  genomad_db:   ""             # OPTIONAL — a geNomad database directory you already hold: what
                               #   `genomad download-database <parent>` leaves in <parent>/genomad_db
                               #   (genomad_db.dbtype, genomad_marker_metadata.tsv, ...). Read ONLY
                               #   when phage.caller: genomad.
                               #   STRONGLY RECOMMENDED if you opt in: geNomad downloads from
                               #   portal.nersc.gov — the same host as CheckV's database, which is
                               #   frequently unreachable — and its downloader has NO mirror option,
                               #   so this path is the only fallback when that host is down.
                               #
                               # All four above follow the same rule as checkv_db: BacFlux only
                               # ever READS these paths (via a local symlink view, never in place),
                               # and each one, when set, overrides the matching download entirely.

# Download URLs for databases the workflow fetches itself.
links:
  phix_link:   ""              # read by illumina, hybrid only (PhiX spike-in removal)
  dbcan_link:  "https://zenodo.org/records/18622157/files/dbcan_db_v5.1.2.tar.gz"  # REQUIRED, all modes — must be a .tar.gz (the .sha256 checksum URL and the extracted-DB folder name are derived from it)
  card_link:   ""              # read by illumina, hybrid only (CARD read-mapping AMR leg)
  checkv_link: "https://zenodo.org/records/21510554/files/checkv-db-v1.5.tar.gz"  # all modes — unmodified mirror of CheckV's own DB (portal.nersc.gov is frequently unreachable). Empty => CheckV downloads its own default DB (from that same NERSC host). IGNORED when directories.checkv_db is set.
  # geNomad database — read ONLY when phage.caller: genomad.
  # This is the Zenodo copy published by geNomad's OWN authors and linked from
  # their README (record 14886553, database v1.9, CC BY 4.0), not a third-party
  # re-upload. It exists here because `genomad download-database` is hard-coded to
  # portal.nersc.gov — the same host as CheckV's DB — with no way to redirect it.
  # Empty => fall back to geNomad's own downloader (that NERSC host).
  # IGNORED when directories.genomad_db is set.
  # Pick the genomad_db_*.tar.gz file, NOT the hmm/msa archives beside it.
  genomad_link: "https://zenodo.org/records/14886553/files/genomad_db_v1.9.tar.gz"
  genomad_md5:  "67244b528bb8bed464d1ca147136d33e"   # MD5 of the file above, as published on that Zenodo record. Zenodo gives an MD5 rather than the .sha256 sidecar the CheckV/dbCAN mirrors carry, so it is set here instead of derived from the URL. CHANGE THIS WHENEVER YOU CHANGE genomad_link — a mismatch stops the run. Empty = download without verification.

# Compute limits.
resources:
  threads: 16                  # all modes  (default 16 if omitted)
  ram_gb:  64                  # read by illumina, hybrid (SPAdes / JVM tools); default 64 if omitted

# Analysis parameters.
parameters:
  nt_version: core_nt          # all modes — which NCBI blast_db subfolder to screen against. Options: core_nt | nt_prok

  # eggNOG-mapper functional annotation — the slowest tail rule on large genomes.
  eggnog:
    dbmem: false               # all modes. false (default): read eggnog.db from disk.
                               #   true: load the 39 GB eggnog.db entirely into RAM to
                               #   speed the annotation phase. Costs ~42 GB RAM PER
                               #   concurrent eggNOG job. Requires resources.ram_gb >= 42
                               #   (checked at parse time). When on, BacFlux prints the
                               #   exact '--resources mem_gb=N' flag to add so Snakemake
                               #   caps concurrent eggNOG jobs to what your RAM holds.

  # Decontamination policy — SHARED across all four modes. After BlobTools
  # assigns each contig a genus, the selector keeps/discards contigs per this
  # policy and writes an audit TSV of every decision.
  decontamination:
    mode: auto                 # Options: auto | include | exclude | off
    discard_no_hit: true       # discard contigs with no taxonomic hit
    include_genera:            # null | "GenusA;GenusB" | [GenusA, GenusB]   (inline genus list to KEEP)
    include_genera_by_sample:  # null | PATH to a 2-column TSV (sample, genus)  ← a FILE PATH, not a mapping
    exclude_genera:            # null | inline genus list to DISCARD
    exclude_genera_file:       # null | PATH to a one-genus-per-line file        ← a FILE PATH
    sample_overrides:          # null | PATH to a per-sample override TSV        ← a FILE PATH

  # Long-read assembly / polishing options, namespaced per mode.
  # The Medaka model is validated BEFORE assembly (rule check_medaka_model): a
  # typo or an unsupported model fails in seconds with a flowcell/device/accuracy
  # suggestion table, instead of after the assembler has run for an hour+.
  nanopore:                    # read only when mode == nanopore
    flye_input_mode: auto      # Options: auto | nano-raw | nano-hq
    medaka_model: auto         # auto/TRUE/empty = infer from FASTQ headers; FALSE = skip Medaka; else an explicit model name
    medaka_model_fallback_auto: false  # if an explicit model is INVALID: false = fail with suggestions (default); true = fall back to auto-inference
  hybrid:                      # read only when mode == hybrid
    flye_input_mode: auto      # Options: auto | nano-raw | nano-hq
    medaka_model: auto         # auto/TRUE/empty = infer; FALSE = skip; else an explicit model name
    medaka_model_fallback_auto: false  # if an explicit model is INVALID: false = fail with suggestions (default); true = fall back to auto-inference

# Phage / virus caller (decision D8). Read by the shared phage module; CheckV runs
# downstream of whichever caller.
# Virus/prophage caller. Default VirSorter2 (permissive licence, commercial use OK).
# geNomad is OPT-IN: it is licensed ACADEMIC / NON-COMMERCIAL-USE-ONLY (Berkeley Lab,
# "accredited academic institution" only). Selecting it also turns on the Platon+
# geNomad plasmid concordance. Only set `genomad` if you are entitled to use it.
phage:
  caller: virsorter2           # Options: virsorter2 (default) | genomad (opt-in, non-commercial licence)

# Optional mobilome / AMR-mobility module (see docs/mobilome_module_SPEC.md).
# Default OFF; when true, adds the 08.mobilome/ stage.
mobilome:
  run: false                   # master switch, default OFF. When true, adds stage
                               #   08.mobilome/: for every AMR gene found, report the
                               #   mobile-element context and a mobility tier
                               #   (1 = chromosomal/intrinsic candidate ... 6 = inside an
                               #   ICE or on a conjugative plasmid = PREDICTED
                               #   self-transmissible). Adds two tools (ISEScan,
                               #   CONJscan/MacSyFinder), both bioconda; no database
                               #   download to configure (nothing to set here).
                               #   LICENCE: turning this on fetches the CONJscan MODELS,
                               #   which Institut Pasteur/CNRS license CC BY-NC-SA 4.0
                               #   (NON-COMMERCIAL). BacFlux never ships them - they are
                               #   downloaded at your request, under your own agreement
                               #   with the licensor, exactly like bakta_db and the other
                               #   user-supplied databases - so BacFlux's own MIT licence
                               #   is unaffected. Commercial users should leave this off
                               #   or obtain permission from the model authors.
                               #   READ THIS: on short-read (fragmented) assemblies the
                               #   located IS count is a FLOOR, not a count — IS elements
                               #   are the main cause of contig breaks, so the element you
                               #   are looking for is often what broke the assembly. Every
                               #   call carries a confidence tier and a contig-boundary
                               #   flag; read them, never a bare count.
  max_composite_span_bp: 20000 # two IS copies further apart than this are not called one
                               #   composite transposon. A CONVENTION, not biology — the
                               #   measured distance is always reported next to the call.
  # ── Naming layer: curated transposons and integrons (ladder tier 4) ────────
  # Leave `url` and `dir` both empty and this whole layer is simply skipped —
  # the module runs exactly as before, and tier 4 stays unreachable.
  #
  # WHAT IT BUYS YOU. Tier 3 is an INFERENCE: two IS copies of one family, the
  # right distance apart, a gene between them, so we call it a composite
  # transposon. That inference has known blind spots — IS26 forms translocatable
  # units with its copies in DIRECT orientation, breaking the same-orientation
  # rule the pattern depends on. A TnCentral hit is not an inference: it matches
  # an element somebody characterised, named and deposited, whose architecture is
  # already known, so it gets IS26 right for free. On the KPNIH1 positive control
  # this moves blaCTX-M-15 from tier 2 ("an IS is next to it, so expression may
  # change") to tier 4, inside TnEcp1.1 — which is the truth: ISEcp1 does not
  # merely modulate blaCTX-M-15, it mobilises it.
  #
  # LICENCE. BacFlux never ships this data. Setting a URL means YOU fetch it,
  # under your own agreement with the licensor — the same arrangement as
  # bakta_db, gtdbtk_db and the CARD link. TnCentral carries an "All Rights
  # Reserved" notice and its terms for commercial use are not stated; check
  # before relying on it outside academic work. The `nc/tn` endpoint below is the
  # transposon set only. TnCentral's other endpoints (tn_in_is, prot/tn_is)
  # additionally carry ISfinder terms, which require written authorisation and
  # forbid redistribution — they are deliberately NOT wired in here.
  tncentral:
    url: ""                    # e.g. https://tncentral.ncc.unesp.br/api/download_blast/nc/tn
                               #   A ZIP holding tncentral.fa (~4.3 MB, ~512 curated
                               #   transposons, integrons and IS). The server rejects
                               #   the default curl user-agent, so the download rule
                               #   sends a browser one; if that stops working the rule
                               #   fails loudly rather than producing an empty database.
    sha256: ""                 # OPTIONAL but recommended. The endpoint is unversioned,
                               #   so this is the only way to know which release you
                               #   analysed with. Leave empty to skip the check; the
                               #   rule records the observed checksum either way, in
                               #   tncentral_db/PROVENANCE.txt.
    dir: ""                    # OPTIONAL — a directory holding tncentral.fa you already
                               #   have. Takes precedence over `url`; nothing is fetched.
    min_identity: 90.0         # percent identity a BLAST hit needs before it may confer
                               #   a curated NAME. Below this the sequence may well be a
                               #   RELATIVE of the element, but calling it by that name
                               #   would claim more than the data shows.
    min_reference_coverage: 0.8
                               # fraction of the REFERENCE element that must be present.
                               #   Measured against the reference, not your contig: the
                               #   question is "is the whole of this known transposon
                               #   here?", and a 7 kb element inside a 300 kb contig
                               #   covers 2% of the contig and 100% of itself. A
                               #   fragment of a transposon is not that transposon —
                               #   on short reads a low value usually means the element
                               #   is split across contigs.

  # ── Naming layer: which ICE is it? ────────────────────────────────────────
  # Leave `urls` empty and this is skipped. Independent of the TnCentral layer
  # above: that one CREATES elements and so makes tier 4 reachable, this one only
  # LABELS the ICE/IME candidates CONJscan already found. Turning it on cannot
  # change any gene's tier — it changes "predicted self-transmissible element"
  # into "ICEKpnATCCBAA-2146-1", which is what lets you look the thing up.
  #
  # It also reveals how far our boundaries fall short. On KPNIH1 the ICE call
  # spans 40,486 bp while ICEberg's record for the same element spans 58,048 bp,
  # and the audit says so — a concrete illustration of why an interval with
  # boundary_method=none is a floor rather than a delimitation.
  #
  # LICENCE. ICEberg 3.0 (Jun 2023) publishes NO licence or terms-of-use
  # statement; every page carries only "Copyright © 2023 All Rights Reserved by
  # Microbial Bioinformatics Group in MML, SJTU." As with TnCentral, BacFlux
  # ships none of this data — setting a URL means you fetch it yourself. Cite
  # Wang et al. 2024 (NAR) if you use it.
  iceberg:
    urls: []                   # e.g.
                               #   - https://tool2-mml.sjtu.edu.cn/ICEberg3/data/download/ICE_seq_all.fas
                               #   - https://tool2-mml.sjtu.edu.cn/ICEberg3/data/download/IME_seq_all.fas
                               #   Concatenated into one BLAST database. NOTE the host:
                               #   the older bioinfo-mml.sjtu.edu.cn path 404s for
                               #   ICEberg 3.0 (it still serves ICEberg 2.0).
                               #   ICE_seq_all.fas is ~100 MB and the server is slow.
    dir: ""                    # OPTIONAL — a directory of .fas files you already hold.
                               #   Takes precedence over `urls`; nothing is fetched.
    min_identity: 80.0         # identity floor for a name. Below this the elements are
                               #   related but not the same, and the name would mislead.
    min_overlap_fraction: 0.5  # how much of OUR candidate the curated element must
                               #   cover before the two are treated as the same thing.
                               #   Deliberately lenient next to the transposon cascade:
                               #   ICEs are mosaic and their cargo varies between
                               #   strains, so demanding near-completeness would refuse
                               #   to name exactly the divergent elements a name helps
                               #   with most. Below 80% of the REFERENCE the name is
                               #   suffixed "-like".

  # ── How many IS copies did the assembly LOSE? (spec WP-C) ─────────────────
  # ILLUMINA AND HYBRID ONLY — it needs reads. Leave the URLs empty to skip it.
  #
  # Everywhere else this module says "on a fragmented assembly the located IS
  # count is a FLOOR, not a count". True, but unquantified: you cannot tell
  # whether the floor is 2 short or 40 short. This leg puts a number on it.
  #
  # Reads are immune to assembly collapse — every copy of an IS contributes its
  # own reads whether or not the assembler kept them apart — so an IS present in
  # five copies attracts about five times the read depth of the single-copy
  # chromosome. Divide the two and you have the copy number:
  #
  #     copy number  ~=  depth over the IS  /  depth over the genome
  #
  # It changes NO AMR gene's tier, and must not: it says nothing about WHERE the
  # extra copies are, only that they exist. It is a quality metric on the IS
  # inventory and the honest companion to the "floor" warning.
  #
  # LICENCE. ISOSDB ships in the pseudoR repository under the MIT licence — the
  # one mobilome database with no redistribution question attached at all.
  # Cite Kirsch et al. 2024, Cell Host & Microbe.
  isosdb:
    fasta_url: ""              # e.g. https://raw.githubusercontent.com/joshuakirsch/pseudoR/main/ISOSDB.V3.fna.zip
                               #   ~9.9 MB zipped, 22,713 IS nucleotide sequences,
                               #   already dereplicated at 95% identity by CD-HIT.
    family_map_url: ""         # e.g. https://raw.githubusercontent.com/joshuakirsch/pseudoR/main/IS_fam_annot.txt
                               #   entry -> IS family (IS3, IS5, IS110 ...). Results are
                               #   reported per FAMILY as well as per entry, because the
                               #   family total is robust to which near-identical entry an
                               #   ambiguous read happened to land on and the per-entry
                               #   split is not.
    dir: ""                    # OPTIONAL — a directory already holding both files.
                               #   Takes precedence over the URLs; nothing is fetched.
    min_covered_percent: 90.0  # a database entry must be covered end to end before its
                               #   depth is believed. A partially covered entry is usually
                               #   a conserved domain shared with another family, and
                               #   averaging it in would inflate every estimate.
    min_copy_number: 0.5       # below this multiple of the genome baseline, the element is
                               #   treated as absent. Deliberately under 1.0: a real
                               #   single-copy IS sits near 1x, and sampling noise plus
                               #   mapping loss routinely pushes it to 0.6-0.8x.

  require_trna_boundary_for_high: false
                               # How strict to be before an ICE/IME candidate may be
                               #   labelled HIGH confidence.
                               #   false (default): confidence answers "how sure are we
                               #     this IS an ICE?" — from the number of anchor classes
                               #     (integrase / relaxase / coupling protein / T4SS),
                               #     whether the machinery is intact, and whether it all
                               #     sits on one contig. Where the element ENDS is
                               #     reported separately, in boundary_method.
                               #   true: also demand that a tRNA-anchored att pair fixed
                               #     the element's ends (the strict reading of spec §8
                               #     Phase 6). On a fragmented short-read assembly the
                               #     flanking sequence is usually missing, so this caps
                               #     nearly every call at medium no matter how good the
                               #     machinery evidence is — it conflates "is this an
                               #     ICE?" with "where does it stop?". Sensible on CLOSED
                               #     long-read assemblies, where an unresolved boundary
                               #     really is a warning sign rather than the norm.
                               #   EITHER WAY: cargo is never assigned from an unresolved
                               #   boundary. A de novo direct repeat is reported but never
                               #   widens an element (~16% of arbitrary spans on a real
                               #   chromosome throw one up by chance), so the interval
                               #   stays the machinery span — a floor, never an invention.
  contig_boundary_bp: 100      # how close to a contig end counts as "at the boundary"
                               #   when FLAGGING an IS call (columns at_contig_boundary
                               #   and fraction_at_contig_boundary in the IS summary).
                               #   A high fraction means the assembly broke exactly where
                               #   the IS elements are - read the located IS count as a
                               #   floor, not a count.
                               #   NOTE this is NOT the same number as the window used to
                               #   CAP confidence in the mobility table. That one is a
                               #   fixed 1000 bp (CONTIG_END_WINDOW_BP in colocalise.py)
                               #   and answers a different question: was there enough
                               #   flanking sequence to have SEEN a neighbouring element
                               #   at all? An IS 500 bp from a contig end is not "at the
                               #   edge", but you still could not have seen its partner
                               #   2 kb away, so absence of evidence there is not
                               #   evidence of absence. Deliberately separate knobs.