name: genomad
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - genomad=1.12.0
  # Download tools for rule genomad_db (shared/70_phage.smk), which fetches the
  # database with wget and unpacks it with tar and gzip. Taken from here so that
  # a minimal Linux system without them still works. Added on 2026-10-21 with
  # --freeze-installed, which left every other package of the pin list as it was.
  - wget=1.25.0
  - tar=1.35
  - gzip=1.14
